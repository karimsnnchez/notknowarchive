backend:
  name: github
  repo: karimsnnchez/notknowarchive
  branch: main
  base_url: https://www.notknowarchive.com
  auth_endpoint: api/auth

media_folder: "KNOT.KNOW ARCHIVE/images"
public_folder: "images"

collections:
  - name: "archive"
    label: "_Archive"
    folder: "KNOT.KNOW ARCHIVE/posts/archive"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fotografía", name: "image", widget: "image" }
      - { label: "Texto", name: "body", widget: "markdown" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list" }

  - name: "studio"
    label: "_Studio"
    folder: "KNOT.KNOW ARCHIVE/posts/studio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fotografía", name: "image", widget: "image" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - label: "Especificaciones"
        name: "specs"
        widget: "list"
        fields:
          - { label: "Campo", name: "key", widget: "string" }
          - { label: "Valor", name: "value", widget: "string" }